name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Install Node deps and build CSS
        run: |
          npm ci
          npm run build:css
          test -s static/dist/app.css

      # Committed app.css is what production serves (no Node on the host).
      # Exact byte-equality against a CI rebuild is flaky across OS/Tailwind
      # minify, so we only require that the build pipeline itself succeeds.
      - name: pytest
        env:
          FLASK_CONFIG: testing
        run: pytest -q

      - name: pip-audit
        run: pip-audit -r requirements.txt
