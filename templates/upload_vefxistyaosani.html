<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Upload Vefxistyaosani - ვეფხის ციქაოსანი</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1em;
        }

        .form-group {
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 10px;
            color: #333;
            font-weight: bold;
        }

        .info-box {
            background: #f0f8ff;
            border-left: 4px solid #667eea;
            padding: 15px;
            margin-bottom: 30px;
            border-radius: 4px;
            color: #333;
        }

        .info-box h3 {
            margin-bottom: 10px;
            color: #667eea;
        }

        .info-box ul {
            margin-left: 20px;
        }

        .info-box li {
            margin-bottom: 5px;
        }

        .checkbox-group {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .checkbox-group input {
            width: 18px;
            height: 18px;
            cursor: pointer;
        }

        .checkbox-group label {
            margin: 0;
            cursor: pointer;
            font-weight: normal;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #667eea;
            color: white;
            border: none;
            border-radius: 5px;
            font-size: 1em;
            cursor: pointer;
            transition: background 0.3s ease;
        }

        button:hover {
            background: #764ba2;
        }

        .nav-link {
            display: inline-block;
            margin-top: 20px;
            padding: 10px 20px;
            background: #666;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s ease;
        }

        .nav-link:hover {
            background: #555;
        }

        .status {
            margin-top: 20px;
            padding: 15px;
            border-radius: 4px;
            display: none;
        }

        .status.success {
            background: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
            display: block;
        }

        .status.error {
            background: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
            display: block;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>ვეფხის ციქაოსანი</h1>
        <p class="subtitle">Upload Vefxistyaosani Lines</p>

        <div class="info-box">
            <h3>📋 CSV File Requirements:</h3>
            <ul>
                <li>Required columns: id, line, chapter, chapter_id, strophe_id, line_id</li>
                <li>File: vefxistyaosani.csv</li>
                <li>Format: CSV (Comma-separated values)</li>
            </ul>
        </div>

        <form id="uploadForm">
            <div class="form-group checkbox-group">
                <input type="checkbox" id="clear_existing" name="clear_existing">
                <label for="clear_existing">Clear existing data before upload</label>
            </div>

            <button type="button" onclick="uploadCSV()">
                📤 Upload vefxistyaosani.csv to Database
            </button>
        </form>

        <div id="status" class="status"></div>

        <a href="/vefxistyaosani" class="nav-link">← View Vefxistyaosani</a>
        <a href="/" class="nav-link">← Back to Home</a>
    </div>

    <script>
        function uploadCSV() {
            const clearExisting = document.getElementById('clear_existing').checked;
            const statusDiv = document.getElementById('status');
            const button = event.target;

            button.disabled = true;
            button.textContent = '⏳ Uploading...';
            statusDiv.className = 'status';
            statusDiv.textContent = '';

            fetch('/vefxistyaosani/upload', {
                method: 'POST',
                body: new FormData(document.getElementById('uploadForm'))
            })
            .then(response => response.text())
            .then(data => {
                statusDiv.className = 'status success';
                statusDiv.textContent = data;
                button.disabled = false;
                button.textContent = '📤 Upload vefxistyaosani.csv to Database';
            })
            .catch(error => {
                statusDiv.className = 'status error';
                statusDiv.textContent = 'Error: ' + error;
                button.disabled = false;
                button.textContent = '📤 Upload vefxistyaosani.csv to Database';
            });
        }
    </script>
</body>
</html>
