<!DOCTYPE html>
<html lang="ka">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>აფორიზმები - Aphorisms</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            padding: 40px;
        }

        h1 {
            text-align: center;
            color: #333;
            margin-bottom: 10px;
            font-size: 2.5em;
        }

        .subtitle {
            text-align: center;
            color: #666;
            margin-bottom: 30px;
            font-size: 1.1em;
        }

        .aphorisms-count {
            text-align: center;
            color: #999;
            margin-bottom: 30px;
            font-size: 0.95em;
        }

        .aphorism-list {
            list-style: none;
        }

        .aphorism-item {
            background: #f9f9f9;
            border-left: 4px solid #667eea;
            padding: 15px 20px;
            margin-bottom: 15px;
            border-radius: 4px;
            transition: all 0.3s ease;
            direction: rtl;
            text-align: right;
        }

        .aphorism-item:hover {
            background: #f0f0f0;
            border-left-color: #764ba2;
            transform: translateX(-5px);
        }

        .aphorism-text {
            color: #333;
            line-height: 1.6;
            font-size: 1.1em;
        }

        .aphorism-number {
            display: inline-block;
            background: #667eea;
            color: white;
            width: 30px;
            height: 30px;
            border-radius: 50%;
            text-align: center;
            line-height: 30px;
            margin-left: 10px;
            font-size: 0.85em;
        }

        .nav-link {
            display: inline-block;
            margin-top: 30px;
            padding: 10px 20px;
            background: #667eea;
            color: white;
            text-decoration: none;
            border-radius: 5px;
            transition: background 0.3s ease;
        }

        .nav-link:hover {
            background: #764ba2;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>აფორიზმები</h1>
        <p class="subtitle">Georgian Aphorisms</p>
        <p class="aphorisms-count">Total: {{ aphorisms|length }} aphorisms</p>

        <ul class="aphorism-list">
            {% for aphorism in aphorisms %}
            <li class="aphorism-item">
                <span class="aphorism-number">{{ loop.index }}</span>
                <p class="aphorism-text">{{ aphorism.text }}</p>
            </li>
            {% endfor %}
        </ul>

        <a href="/" class="nav-link">← Back to Home</a>
    </div>
</body>
</html>
